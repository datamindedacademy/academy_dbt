version: 2
sources:
  - name: tpch
    database: "{{ 'samples' if target.type == 'databricks' else target.database }}"
    schema: tpch
    tables:
      - name: customer
      - name: orders
      - name: nation
      - name: region
      - name: lineitem
      - name: part
      - name: partsupp
      - name: supplier
models:
  - name: customer_stats
    description: Customer totals for a small course check.
    columns:
      - name: c_custkey
        data_tests: [unique, not_null]
      - name: total_spent
        data_tests: [not_null]
